name: smarthome
description: Кроссплатформенное приложение для управления умным домом

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP клиент
  dio: ^5.4.3
  # WebSocket
  web_socket_channel: ^2.4.5
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Безопасное хранение токена
  flutter_secure_storage: ^9.0.0
  # Навигация
  go_router: ^13.2.1
  # Иконки устройств
  cupertino_icons: ^1.0.6
  # Форматирование дат
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
